load_module /etc/nginx/modules/ngx_http_modsecurity_module.so;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity/main.conf;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/rss+xml
        font/woff2
        font/ttf
        image/svg+xml
        image/x-icon;

    # Shared upstreams
    upstream django_website {
        server django_website:8000;
    }

    upstream django_shop {
        server django_shop:8000;
    }

    upstream django_admin {
        server django_admin:8000;
    }

    # Shared proxy settings.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_redirect off;

    # Strip upstream security headers so Nginx is the single source of truth.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;

    include /etc/nginx/conf.d/*.conf;
}
