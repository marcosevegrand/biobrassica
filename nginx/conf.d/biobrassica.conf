# biobrassica.pt — Main brand/content website
server {
    listen 80;
    server_name biobrassica.pt www.biobrassica.pt lvh.me;

    # Redirect www to bare domain.
    # Use https:// explicitly — nginx is HTTP-only; $scheme would always be http.
    if ($host = www.biobrassica.pt) {
        return 301 https://biobrassica.pt$request_uri;
    }

    # Static files
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Block admin access
    location /admin/ {
        return 404;
    }

    # Proxy to Django
    location / {
        proxy_pass http://django;
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
