name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: biobrassica
          POSTGRES_USER: biobrassica
          POSTGRES_PASSWORD: biobrassica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biobrassica -d biobrassica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: this-is-a-ci-only-secret-key-with-enough-entropy-for-deploy-checks-123456
      ALLOWED_HOSTS: localhost,127.0.0.1,lvh.me,loja.lvh.me,admin.lvh.me
      DB_NAME: biobrassica
      DB_USER: biobrassica
      DB_PASSWORD: biobrassica
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_URL: redis://127.0.0.1:6379/0
      EMAIL_HOST: localhost
      EMAIL_HOST_USER: ci-user
      EMAIL_HOST_PASSWORD: ci-password
      EMAIL_PORT: 1025
      STRIPE_SECRET_KEY: sk_test_ci_secret
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_publishable
      STRIPE_WEBHOOK_SECRET: whsec_ci_secret
      STRIPE_CURRENCY: eur
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate production compose
        run: docker compose -f docker-compose.yml config

      - name: Validate development compose
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config

      - name: Run migrations
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: python manage.py migrate --noinput

      - name: Run full Django test suite
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: >-
          python manage.py test
          apps.accounts.tests
          apps.catalog.tests
          apps.cart.tests
          apps.content.tests
          apps.core.tests
          apps.orders.tests
          apps.payments.tests
          apps.website.tests

      - name: Run deploy checks
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
        run: python manage.py check --deploy

      - name: Build production image
        run: docker compose -f docker-compose.yml build django

      - name: Smoke test production entrypoint
        run: >-
          docker compose -f docker-compose.yml run --rm django
          sh -lc 'DJANGO_SETTINGS_MODULE=config.settings.production /app/docker-entrypoint.sh gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --check-config'

      - name: Backup script dry-run
        run: BACKUP_DRY_RUN=1 ./scripts/backup.sh "$(mktemp -d)"

      - name: Verify backup/restore contract
        run: |
          TMP_DIR="$(mktemp -d)"
          docker compose -f docker-compose.yml up -d db
          ./scripts/backup.sh "$TMP_DIR"
          DB_BACKUP="$(find "$TMP_DIR" -maxdepth 1 -name 'db_*.sql.gz' | head -n 1)"
          MEDIA_BACKUP="$(find "$TMP_DIR" -maxdepth 1 -name 'media_*.tar.gz' | head -n 1)"
          [ -n "$DB_BACKUP" ]
          [ -n "$MEDIA_BACKUP" ]
          gunzip -t "$DB_BACKUP"
          tar tzf "$MEDIA_BACKUP" > /dev/null
          RESTORE_DRY_RUN=1 sh ./scripts/restore.sh --db "$DB_BACKUP" --media "$MEDIA_BACKUP"

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /opt/biobrassica
            PREVIOUS_SHA=$(git rev-parse HEAD)
            echo "Rollback candidate: ${PREVIOUS_SHA}"
            git fetch --prune origin
            git checkout --force ${{ github.sha }}
            docker compose -f docker-compose.yml build
            docker compose -f docker-compose.yml run --rm django python manage.py migrate --noinput
            docker compose -f docker-compose.yml up -d --remove-orphans
            docker compose -f docker-compose.yml exec -T django python manage.py check --deploy
            curl -fsS -H 'Host: biobrassica.pt' http://127.0.0.1/_health/ > /dev/null
            curl -fsS -H 'Host: loja.biobrassica.pt' http://127.0.0.1/_health/ > /dev/null
            curl -fsS -H 'Host: admin.biobrassica.pt' http://127.0.0.1/_health/ > /dev/null
            echo "Deploy complete at $(date)"
            echo "Rollback candidate remains: ${PREVIOUS_SHA}"
