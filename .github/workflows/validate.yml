name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test_sqlite
      DJANGO_ALLOW_INSECURE_DEFAULTS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Create virtualenv
        run: python -m venv backend/.venv

      - name: Install Python dependencies
        run: |
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt

      - name: Install Playwright Chromium
        run: backend/.venv/bin/python -m playwright install --with-deps chromium

      - name: Compile locale catalogs
        working-directory: backend
        run: .venv/bin/python manage.py compilemessages

      - name: Run pyright
        run: backend/.venv/bin/python -m pyright

      - name: Run pytest
        working-directory: backend
        run: .venv/bin/python -m pytest -q