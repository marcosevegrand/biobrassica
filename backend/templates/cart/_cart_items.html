{% load i18n %}

{% if items %}
<div class="space-y-6">
  {% for item in items %}
  {% include "cart/_cart_item.html" with item=item %}
  {% endfor %}
</div>

{% else %}
<div class="text-center py-24">
  <p class="text-muted text-lg mb-6">{% trans "O seu carrinho está vazio." %}</p>
  <a href="{% url 'catalog:product_list' %}"
     class="inline-block text-xs uppercase tracking-widest border border-forest px-6 py-3 rounded-sm hover:bg-forest hover:text-paper transition-colors">
    {% trans "Ver produtos" %}
  </a>
</div>
{% endif %}
