{% load i18n %}

<div id="cart-item-{{ item.pk }}" data-cart-item-row class="flex items-center gap-6 border-b border-stone/30 pb-6">
  {% if item.product.primary_image %}
  <img src="{{ item.product.primary_image.image.url }}" alt="{{ item.product.get_name }}"
       class="w-20 h-20 object-cover rounded-sm" />
  {% else %}
  <div class="w-20 h-20 bg-stone/20 rounded-sm"></div>
  {% endif %}

  <div class="flex-1">
    <h3 class="font-serif text-lg italic">{{ item.product.get_name }}</h3>
    <p class="text-sm text-muted">{{ item.product.price_display }}</p>
  </div>

  <form method="post" action="{% url 'cart:update' item_id=item.pk %}"
        hx-post="{% url 'cart:update' item_id=item.pk %}"
        hx-target="closest [data-cart-item-row]"
        hx-swap="outerHTML"
        class="flex items-center gap-2">
    {% csrf_token %}
    <div class="flex items-center border border-stone/40 rounded-sm">
      <button type="submit" name="quantity" value="{{ item.quantity|add:'-1' }}"
              class="px-2 py-1 text-muted hover:text-forest text-sm">−</button>
      <span class="px-3 py-1 text-sm border-x border-stone/40">{{ item.quantity }}</span>
      <button type="submit" name="quantity" value="{{ item.quantity|add:'1' }}"
              class="px-2 py-1 text-muted hover:text-forest text-sm">+</button>
    </div>
  </form>

  <p class="text-sm font-medium w-20 text-right">{{ item.subtotal|floatformat:2 }}€</p>

  <form method="post" action="{% url 'cart:remove' item_id=item.pk %}"
        hx-post="{% url 'cart:remove' item_id=item.pk %}"
        hx-target="closest [data-cart-item-row]"
        hx-swap="outerHTML">
    {% csrf_token %}
    <button type="submit" class="text-muted hover:text-red-600 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </form>
</div>
