{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Biobrassica{% endblock %}</title>
  <meta name="description" content="{% block description %}Biobrassica — produtos biológicos selecionados com cuidado no coração do Minho.{% endblock %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  {% block head_extra %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col bg-paper text-forest font-sans font-light">

  {% block body %}{% endblock %}

</body>
</html>
