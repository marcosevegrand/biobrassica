{% extends "base.html" %}
{% load i18n %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-24 text-center">
  <h1 class="font-serif text-4xl italic mb-6">{% trans "Password alterada" %}</h1>
  <p class="text-muted mb-8">{% trans "A sua password foi redefinida com sucesso." %}</p>
  <a href="{% url 'accounts:login' %}"
     class="inline-block text-xs uppercase tracking-widest bg-forest text-paper px-8 py-4 rounded-sm hover:bg-terracotta transition-colors">
    {% trans "Entrar" %}
  </a>
</section>
{% endblock %}
