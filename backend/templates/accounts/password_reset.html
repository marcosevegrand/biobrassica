{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Recuperar password" %} | Biobrassica{% endblock %}

{% block content %}
<section class="max-w-md mx-auto px-6 py-24">
  <h1 class="font-serif text-4xl italic text-center mb-12">{% trans "Recuperar password" %}</h1>

  <form method="post">
    {% csrf_token %}
    <div>
      <label class="block text-xs uppercase tracking-widest text-muted mb-2">{% trans "Email" %}</label>
      <input type="email" name="email" required
             class="w-full px-4 py-3 border border-stone/40 rounded-sm focus:outline-none focus:border-forest text-sm" />
    </div>

    <button type="submit"
            class="mt-8 w-full text-xs uppercase tracking-widest bg-forest text-paper px-8 py-4 rounded-sm hover:bg-terracotta transition-colors">
      {% trans "Enviar link de recuperação" %}
    </button>
  </form>
</section>
{% endblock %}
