<div class="grid gap-4 md:grid-cols-2 xl:grid-cols-4 mb-6">
  {% for card in workflow_metric_cards %}
  <a href="{{ card.link|default:'#' }}" class="block rounded-default border border-base-200 bg-white p-4 shadow-xs transition-colors hover:border-primary-400 dark:border-base-800 dark:bg-base-900">
    <p class="text-xs uppercase tracking-widest text-base-500 dark:text-base-400">{{ card.label }}</p>
    <div class="mt-3 flex items-end justify-between gap-3">
      <strong class="text-3xl font-semibold text-font-default-light dark:text-font-default-dark">{{ card.value }}</strong>
      {% if card.context %}
      <span class="text-xs text-base-500 dark:text-base-400 text-right">{{ card.context }}</span>
      {% endif %}
    </div>
  </a>
  {% endfor %}
</div>
