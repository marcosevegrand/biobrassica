<div class="pickup-locations-widget flex flex-col gap-3" data-pickup-locations-field>
    {% if widget.flat_choices %}
        <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-3">
            {% for option in widget.flat_choices %}
                <label class="cursor-pointer">
                    <input
                        type="checkbox"
                        name="{{ widget.name }}"
                        value="{{ option.value }}"
                        class="peer sr-only"
                        {% if option.selected %}checked{% endif %}
                    >
                    <span class="flex min-h-20 flex-col justify-center rounded-default border border-base-200 bg-white px-4 py-3 text-sm font-medium text-font-important-light transition-colors peer-checked:border-primary-600 peer-checked:bg-primary-50 peer-checked:text-primary-700 dark:border-base-800 dark:bg-base-900 dark:text-font-important-dark dark:peer-checked:border-primary-500 dark:peer-checked:bg-primary-950/40 dark:peer-checked:text-primary-300">
                        {{ option.label }}
                    </span>
                </label>
            {% endfor %}
        </div>
    {% else %}
        <div class="rounded-default border border-dashed border-base-300 bg-base-50 px-4 py-4 text-sm text-base-600 dark:border-base-700 dark:bg-base-900 dark:text-base-300">
            Não existem locais de levantamento ativos para selecionar.
        </div>
    {% endif %}
</div>
