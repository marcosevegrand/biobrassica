[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = tests.py test_*.py *_tests.py
testpaths = apps tests
addopts = --strict-markers
markers =
    fast: pure unit/service/model/form/queryset tests with mocked I/O
    integration: request/response and database-backed integration tests
    contract: external boundary and event-shape tests
    security: abuse and hardening regression tests
    browser: browser-driven smoke and full journey tests
    performance: query-count and performance smoke tests
    admin: admin-only paths and workflows
    subdomain: host-routing and multi-surface tests
    htmx: HTMX fragment and out-of-band response tests
    stripe: Stripe-specific payment tests
    ifthenpay: Ifthenpay-specific payment tests
    slow: suites excluded from the default fast workflow