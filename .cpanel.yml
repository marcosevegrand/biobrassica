---
deployment:
  tasks:
    - export APPPATH=$HOME/biobrassica
    - export PUBLICPATH=$HOME/public_html
    - export PHPBIN=/usr/local/bin/php
    - test -x /opt/cpanel/ea-php83/root/usr/bin/php && export PHPBIN=/opt/cpanel/ea-php83/root/usr/bin/php
    - /bin/mkdir -p $PUBLICPATH
    - /bin/mkdir -p $PUBLICPATH/storage
    - /bin/mkdir -p $APPPATH/bootstrap/cache
    - /bin/mkdir -p $APPPATH/storage/app/public
    - /bin/mkdir -p $APPPATH/storage/framework/cache/data
    - /bin/mkdir -p $APPPATH/storage/framework/sessions
    - /bin/mkdir -p $APPPATH/storage/framework/views
    - /bin/mkdir -p $APPPATH/storage/logs
    - /bin/cp -R public/. $PUBLICPATH
    - /bin/cp public_html/index.php $PUBLICPATH/index.php
    - /bin/cp public_html/.htaccess $PUBLICPATH/.htaccess
    - /bin/cp public_html/.user.ini $PUBLICPATH/.user.ini
    - test -f $APPPATH/vendor/autoload.php && echo "vendor/ OK" || echo "ERROR: vendor/ missing, upload it to $APPPATH/vendor/"
    - test -f $APPPATH/.env && echo ".env OK" || echo "ERROR: .env missing, create it at $APPPATH/.env"
    - cd $APPPATH && $PHPBIN artisan optimize:clear 2>&1
    - cd $APPPATH && $PHPBIN artisan migrate --force 2>&1
    - cd $APPPATH && $PHPBIN artisan db:seed --force 2>&1
    - cd $APPPATH && $PHPBIN artisan config:cache 2>&1
    - cd $APPPATH && $PHPBIN artisan route:cache 2>&1
    - cd $APPPATH && $PHPBIN artisan view:cache 2>&1
