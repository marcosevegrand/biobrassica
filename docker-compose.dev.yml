## Development overrides — used by ./scripts/dev.sh and make dev.
services:
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DJANGO_SECRET_KEY=${DEV_DJANGO_SECRET_KEY:-django-insecure-dev-local-key}
      - DJANGO_LOG_LEVEL=${DJANGO_LOG_LEVEL:-DEBUG}
      - DB_NAME=biobrassica
      - DB_USER=biobrassica
      - DB_PASSWORD=${DEV_DB_PASSWORD:-biobrassica}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - MANUAL_MBWAY_NUMBER=${MANUAL_MBWAY_NUMBER:-}
      - BANK_TRANSFER_BENEFICIARY=${BANK_TRANSFER_BENEFICIARY:-}
      - BANK_TRANSFER_IBAN=${BANK_TRANSFER_IBAN:-}
      - BANK_TRANSFER_BIC=${BANK_TRANSFER_BIC:-}
    depends_on:
      db:
        condition: service_healthy

  tailwind:
    image: node:22-alpine
    working_dir: /app
    stdin_open: true
    tty: true
    command: >
      sh -c "if [ ! -d node_modules/@tailwindcss/cli ]; then npm ci; fi &&
             npx @tailwindcss/cli -i assets/css/input.css -o static/css/output.css --watch"
    volumes:
      - ./backend:/app
      - tw_node_modules:/app/node_modules
    restart: unless-stopped

  db:
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: biobrassica
      POSTGRES_USER: biobrassica
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-biobrassica}

  redis:
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  tw_node_modules:
