## Development overrides — opt in explicitly with:
## docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./backend/staticfiles:/app/staticfiles
      - ./backend/media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DJANGO_SECRET_KEY=${DEV_DJANGO_SECRET_KEY:-django-insecure-dev-local-key}
      - DJANGO_LOG_LEVEL=${DJANGO_LOG_LEVEL:-DEBUG}
      - DB_NAME=biobrassica
      - DB_USER=biobrassica
      - DB_PASSWORD=${DEV_DB_PASSWORD:-biobrassica}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-stripe}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_CURRENCY=${STRIPE_CURRENCY:-eur}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - IFTHENPAY_API_BASE_URL=${IFTHENPAY_API_BASE_URL:-https://api.ifthenpay.com}
      - IFTHENPAY_MBWAY_KEY=${IFTHENPAY_MBWAY_KEY:-}
      - IFTHENPAY_ANTI_PHISHING_KEY=${IFTHENPAY_ANTI_PHISHING_KEY:-}
      - PAYMENTS_FORCE_DISABLED=${PAYMENTS_FORCE_DISABLED:-0}
    depends_on:
      db:
        condition: service_healthy

  tailwind:
    image: node:22-alpine
    working_dir: /app
    stdin_open: true
    tty: true
    command: >
      sh -c "if [ ! -d node_modules/@tailwindcss/cli ]; then npm ci; fi &&
             npx @tailwindcss/cli -i assets/css/input.css -o static/css/output.css --watch"
    volumes:
      - ./backend:/app
      - tw_node_modules:/app/node_modules
    restart: unless-stopped

  db:
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: biobrassica
      POSTGRES_USER: biobrassica
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-biobrassica}

  redis:
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ["tools"]
    entrypoint: ["stripe"]
    environment:
      - STRIPE_API_KEY=${STRIPE_SECRET_KEY:-}

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./backend/staticfiles:/var/www/static:ro
      - ./backend/media:/var/www/media:ro

volumes:
  tw_node_modules: